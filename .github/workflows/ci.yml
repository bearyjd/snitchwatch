name: CI

on:
  push:
    branches: [main]
  pull_request:

# Scope: default-members only (snitchwatch-proto, -spike, -bridge, -bridge-cli,
# -tauri, scanner-core, scanner-cli, scanner-privileged, tests/mock_opensnitchd,
# tests/integration). `kirigami-spike` / `snitchwatch-kirigami` are deliberately
# NOT built here: they need system Qt6 + KF6 Kirigami dev packages that aren't
# provisioned on this runner, and whether their tests pass headless in a CI
# image is unverified (see .agent_native/agent_roadmap.md item 6 and
# CLAUDE.md). `just check`/`just test` pass `--workspace` and so *do* touch
# those two crates when run locally with Qt6 installed; this workflow uses
# plain `cargo check`/`cargo clippy`/`cargo test` (no `--workspace`) so cargo
# falls back to `default-members` from Cargo.toml, matching a bare `cargo
# build` and avoiding the Qt6 dependency. Once item 6 is verified, this can
# switch to literally shelling out to `just check`/`just test`.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false # vendor/opensnitch is reference-only, not needed to build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # snitchwatch-tauri is in default-members and its build.rs links against
      # webkit2gtk/javascriptcoregtk via tauri-build, even for `cargo check`.
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - name: cargo check (default-members)
        run: cargo check --locked

      - name: cargo clippy (default-members)
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - name: cargo test (default-members)
        run: cargo test --locked
