# Flatpak manifest — Snitchwatch GUI shell.
#
# Scope: this Flatpak contains the GUI shell ONLY. The bridge
# (snitchwatch-bridge-cli) and its gRPC connection to the privileged
# opensnitchd daemon stay entirely host-side, outside the sandbox, running as
# a systemd --user service (../systemd/snitchwatch-bridge.service). See the
# fail-open stance in docs/superpowers/plans/2026-07-05-phase2-packaging.md
# and the feasibility research in
# docs/superpowers/specs/2026-07-04-flatpak-feasibility-research.md.
#
# GUI shell: snitchwatch-kirigami (Qt6/QML + Kirigami, cxx-qt), NOT
# snitchwatch-tauri. Per the settled architecture decision (see this repo's
# CLAUDE.md "Settled architecture decisions" #4 and
# docs/superpowers/plans/2026-07-04-kirigami-shell-rewrite.md), Kirigami is
# the shell going forward — it's a native match for Bazzite's default KDE
# Plasma desktop, has reached feature parity with the old Tauri+web shell,
# and passed its Task 7 fullscreen-focus safety verification
# (2026-07-11). `crates/snitchwatch-tauri/` and `web/` still exist in the
# repo (kept until this Flatpak's first real packaged release ships — see
# the kirigami-shell-rewrite plan's status note), but they are intentionally
# NOT what this manifest packages.
#
# Why no --share=network:
#   A Flatpak's default sandbox has its own private, isolated network
#   namespace with its own private loopback device. It therefore CANNOT reach
#   a host-bound 127.0.0.1 service regardless of auth, and --share=network
#   would not scope down to loopback — it grants full, unrestricted internet
#   access (the same grant a torrent client requests). So the GUI does NOT
#   talk to the host-side bridge over TCP loopback. Instead it connects over
#   a Unix domain socket under $XDG_RUNTIME_DIR/snitchwatch/, reached via the
#   filesystem permission below. This is the exact daemon-over-socket pattern
#   virt-manager's Flathub-approved manifest uses for libvirtd.
#
# Building (requires flatpak-builder + the KDE runtime; NOT runnable in the
# CI sandbox this was authored in — verify runtime-version against whatever
# org.kde.Platform release is current at build time, e.g.
# `flatpak remote-info flathub org.kde.Platform`, and bump it if stale):
#   1. Vendor Cargo deps offline (flatpak-builder has no network mid-build):
#        python3 flatpak-cargo-generator.py Cargo.lock -o \
#          packaging/flatpak/generated-cargo-sources.json
#      (from https://github.com/flatpak/flatpak-builder-tools/tree/master/cargo)
#   2. flatpak run org.flatpak.Builder --user --install --force-clean \
#        build-dir packaging/flatpak/org.snitchwatch.Snitchwatch.yml
---
app-id: org.snitchwatch.Snitchwatch
runtime: org.kde.Platform
runtime-version: "6.9"
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: snitchwatch-kirigami

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    # Build-time only. The runtime sandbox gets NO network access
    # (no --share=network in finish-args); network here is solely so the
    # release build can link against pre-vendored crates.
    - --share=network
  env:
    CARGO_HOME: /run/build/snitchwatch-kirigami/cargo

finish-args:
  # Display + GPU for QtQuick/QML rendering.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Desktop integration: notifications (notify-rust, speaks the standard
  # org.freedesktop.Notifications D-Bus interface directly — cxx-kde-frameworks
  # doesn't expose KNotification, so this shell dispatches via that interface
  # rather than KNotification) + tray (Qt.labs.platform.SystemTrayIcon, which
  # renders via the host compositor's StatusNotifierItem support on Plasma).
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # Reach the host-side bridge's Unix domain socket + handshake token under
  # $XDG_RUNTIME_DIR/snitchwatch/. Read-write (NOT :ro) because connect()ing
  # to a Unix socket needs write access, and the same grant covers reading
  # the token file that lives beside it. This single line replaces what would
  # otherwise have been --share=network.
  - --filesystem=xdg-run/snitchwatch
  # GUI-owned config/state/data (autostart toggle, crash log, etc.).
  - --persist=.local/share/snitchwatch
  - --filesystem=xdg-config/snitchwatch:create
  - --filesystem=xdg-state/snitchwatch:create

modules:
  - name: snitchwatch-kirigami
    buildsystem: simple
    build-commands:
      # No CMake step: snitchwatch-kirigami is a plain `cargo build` — its
      # build.rs (cxx-qt-build) drives moc/rcc/qmlcachegen directly, with no
      # CMakeLists.txt exporting to an external C++ build system. The KDE SDK
      # provides the Qt6 build tools (moc, rcc, qmlcachegen) cxx-qt-build
      # shells out to.
      - cargo build --release --offline -p snitchwatch-kirigami
      - install -Dm755 target/release/snitchwatch-kirigami /app/bin/snitchwatch-kirigami
      - install -Dm644 packaging/flatpak/org.snitchwatch.Snitchwatch.desktop
          /app/share/applications/org.snitchwatch.Snitchwatch.desktop
      - install -Dm644 packaging/flatpak/org.snitchwatch.Snitchwatch.metainfo.xml
          /app/share/metainfo/org.snitchwatch.Snitchwatch.metainfo.xml
      # No web/ install step: the Kirigami shell compiles its QML in via a
      # qrc resource (see crates/snitchwatch-kirigami/build.rs's QmlModule),
      # it does not serve web/ over HTTP into a webview the way
      # snitchwatch-tauri did.
    sources:
      - type: dir
        path: ../..
      # Offline Cargo dependency sources, generated by flatpak-cargo-generator.py
      # (see the build note at the top). Regenerate whenever Cargo.lock changes.
      - generated-cargo-sources.json
