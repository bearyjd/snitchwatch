# BlueBuild recipe — "batteries-included" Snitchwatch image.
#
# Bakes the OpenSnitch daemon (opensnitchd) into a custom Bazzite image and
# enables it at boot.
#
# On its own this recipe ships the per-user flavour's daemon config:
# `Server.Address: 127.0.0.1:50051`, `DefaultAction: deny` (settled decision
# 5: never upstream's fail-open `allow`). That TCP transport is NOT
# deny-safe: any local process that binds the port first gets the daemon's
# UI authority, deny or not (#35). It never dials a socket that isn't there.
#
# The r15 image adds the system-bridge overlay in the same build:
# `../system/stage.sh` (with a verified binary) stages the bridge, its
# service and two socket units, sysusers/tmpfiles, the `opensnitch.service`
# drop-in, and the fail-closed daemon config (`unix:opensnitchd.sock`,
# `DefaultAction: deny`). Copy the staged tree in AFTER this recipe's files
# module, so its config replaces the one below, and enable the two `.socket`
# units. Config, drop-in and socket are one artifact (PR #166 H1); this
# recipe never ships the unix address without them (packaging_shape.rs).
# See ../../docs/packaging/system-bridge-integration.md.
#
# The GUI ships as a Flatpak: the system profile
# (../flatpak/org.snitchwatch.Snitchwatch.system.yml) with the overlay.
#
# Build locally (needs the `bluebuild` CLI + podman/buildah on a host that can
# run OCI builds — NOT possible in the CI sandbox this was authored in):
#
#     bluebuild build packaging/bluebuild/recipe.yml
#
# BlueBuild treats the directory containing this recipe as its config root, so
# the `files` module below resolves `source: system` to
# `packaging/bluebuild/files/system/`.
#
# Reference: https://blue-build.org/reference/recipe/
---
name: snitchwatch-bazzite
description: Bazzite with the OpenSnitch daemon baked in and pre-hardened for Snitchwatch.
base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  # 1. Layer opensnitchd into the base image. Corrected 2026-07-31 (issue
  #    #7): opensnitch is NOT packaged in Fedora's repos or Bazzite's COPR
  #    set — `rpm-ostree install opensnitch` fails with "No match for
  #    argument" (verified live on a Bazzite host and a clean fedora:43
  #    container). Install the upstream GitHub release RPM by URL instead,
  #    pinned to v1.8.0 to match this repo's vendored submodule. The GUI
  #    (`opensnitch-ui`) is deliberately NOT installed, since Snitchwatch
  #    replaces it. `info` is an explicit RPM dependency; `nftables` and
  #    `libnetfilter_queue` are interception deps (present in Bazzite,
  #    declared for safety — idempotent).
  - type: rpm-ostree
    install:
      - info
      - nftables
      - libnetfilter_queue
      - https://github.com/evilsocket/opensnitch/releases/download/v1.8.0/opensnitch-1.8.0-1.x86_64.rpm

  # 2. Drop the per-user flavour's daemon config into place: it overrides
  #    upstream's fail-open `DefaultAction: allow` with `deny` and points
  #    `Server.Address` at the per-user bridge's TCP bind (not deny-safe,
  #    #35). The system overlay's config (deny, the root-only socket)
  #    replaces it.
  #    It keeps upstream's `ProcMonitorMethod: ebpf`. (A 2026-07-31 note
  #    here briefly shipped `proc`, citing an eBPF module-load failure on
  #    kernel 6.19 — re-verification showed that failure was a *rootless
  #    container permissions* artifact, not kernel incompatibility; under
  #    root, as the baked daemon runs, ebpf loads fine on 6.19. See issue
  #    #6's post-close correction comment.)
  #    See files/system/etc/opensnitchd/default-config.json.
  #    The same module ships the one Snitchwatch rule,
  #    files/system/etc/opensnitchd/rules/000-snitchwatch-bridge-fetch.json:
  #    it lets the *system* bridge (account `snitchwatch`) download
  #    blocklists over HTTPS. Until the image stages the system overlay
  #    (whose sysusers file creates that account), the daemon logs that it
  #    can't compile the rule, skips it, and nothing is allowed by it. See
  #    ../../docs/superpowers/plans/
  #    2026-10-08-packaged-bridge-fetch-rule.md.
  - type: files
    files:
      - source: system
        destination: /

  # 3. Enable the daemon at boot. The opensnitch RPM ships
  #    /usr/lib/systemd/system/opensnitch.service, with no alias named after
  #    the opensnitchd binary (vendor/opensnitch/utils/packaging/daemon/rpm/
  #    opensnitch.spec, issue #92); we just flip it on so the firewall is
  #    active from first boot, before any GUI is ever launched.
  - type: systemd
    system:
      enabled:
        - opensnitch.service

  # 4. Sign the image so `rpm-ostree`/`bootc` can verify it. Requires the
  #    cosign key pair generated by `bluebuild new`/`cosign generate-key-pair`;
  #    see https://blue-build.org/how-to/cosign/.
  - type: signing
