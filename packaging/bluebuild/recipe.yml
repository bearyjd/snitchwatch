# BlueBuild recipe — "batteries-included" Snitchwatch image.
#
# Bakes the OpenSnitch daemon (opensnitchd) into a custom Bazzite image and
# enables it at boot, pre-configured to fail *closed* (DefaultAction: deny)
# and to dial the Snitchwatch bridge's default gRPC bind (127.0.0.1:50051).
#
# The Snitchwatch GUI itself is NOT baked into this image — it ships as a
# Flatpak (see ../flatpak/org.snitchwatch.Snitchwatch.yml) and the bridge
# runs as a per-user systemd service (see ../systemd/snitchwatch-bridge.service),
# both installed per-user on first run. Only the privileged, host-level
# daemon belongs in the OS image.
#
# Build locally (needs the `bluebuild` CLI + podman/buildah on a host that can
# run OCI builds — NOT possible in the CI sandbox this was authored in):
#
#     bluebuild build packaging/bluebuild/recipe.yml
#
# BlueBuild treats the directory containing this recipe as its config root, so
# the `files` module below resolves `source: system` to
# `packaging/bluebuild/files/system/`.
#
# Reference: https://blue-build.org/reference/recipe/
---
name: snitchwatch-bazzite
description: Bazzite with the OpenSnitch daemon baked in and pre-hardened for Snitchwatch.
base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  # 1. Layer opensnitchd into the base image. opensnitch is already packaged
  #    for Fedora, so this is a plain package install — no COPR or custom RPM
  #    needed. `opensnitch` pulls in the daemon; the GUI (`opensnitch-ui`) is
  #    deliberately NOT installed, since Snitchwatch replaces it.
  - type: rpm-ostree
    install:
      - opensnitch

  # 2. Drop our hardened daemon config into place. This overrides upstream's
  #    `DefaultAction: allow` (fail-open) with `DefaultAction: deny`
  #    (fail-closed) and points `Server.Address` at the bridge's default bind.
  #    See files/system/etc/opensnitchd/default-config.json.
  - type: files
    files:
      - source: system
        destination: /

  # 3. Enable the daemon at boot. The opensnitch RPM ships
  #    /usr/lib/systemd/system/opensnitchd.service; we just flip it on so the
  #    firewall is active from first boot, before any GUI is ever launched.
  - type: systemd
    system:
      enabled:
        - opensnitchd.service

  # 4. Sign the image so `rpm-ostree`/`bootc` can verify it. Requires the
  #    cosign key pair generated by `bluebuild new`/`cosign generate-key-pair`;
  #    see https://blue-build.org/how-to/cosign/.
  - type: signing
