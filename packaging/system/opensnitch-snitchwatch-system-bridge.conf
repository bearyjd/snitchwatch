# opensnitch.service drop-in for the Snitchwatch system bridge (#35).
# Staged by stage.sh with the socket it requires. The daemon's
# `Server.Address: unix:opensnitchd.sock` is relative and resolves in this
# working directory, after systemd has created the root-only listener
# (OpenSnitch 1.8.0 can't parse the absolute unix:/// form).
[Unit]
Requires=snitchwatch-system-bridge-grpc.socket
After=snitchwatch-system-bridge-grpc.socket

[Service]
WorkingDirectory=/run/snitchwatch
