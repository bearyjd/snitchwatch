# Snitchwatch: share this computer's connection events with Vigie (opt-in).
#
# Install as /etc/rsyslog.d/snitchwatch-endpoint-events.conf only by following
# packaging/endpoint-events/README.md. Replace the four @...@ placeholders
# first; rsyslog won't start with them in place. The three files under
# /etc/pki/snitchwatch-endpoint-events/ must exist: Vigie's CA, and this
# computer's client certificate and key (mutual TLS; see the README).
#
#   opensnitchd --(remote logger, JSON lines, TCP 127.0.0.1:514)--> this file
#     --(allowlisted fields only, mutual TLS, pinned CA)--> Vigie
#
# Privacy: the daemon's raw event carries each process's environment,
# arguments, working directory, process tree and checksums. Those never leave
# this computer: the template below names only the allowlisted fields, so
# everything else is dropped here, before the forward.
#
# Comments in this file use `#` only (the packaging_shape tests rely on it).

# Size limits.
# - In: the daemon's raw line carries the whole process environment and
#   arguments, often beyond rsyslog's 8k default. A truncated line fails to
#   parse and would be silently dropped, so accept up to 64k (this is
#   rsyslog-wide; larger events are truncated and dropped).
# - Out: Vigie drops frames over 8 KiB. The template caps the variable-length
#   fields (process_path 768, dst_host 253, rule 128 bytes, cut before JSON
#   escaping) so a forwarded frame stays under 8 KiB even if every capped
#   byte needs escaping, with a host id of up to 64 characters.
global(maxMessageSize="64k")

module(load="imtcp")
module(load="mmjsonparse")

# Loopback only, on the port the daemon's logger dials. 514 is below
# net.ipv4.ip_unprivileged_port_start, so no unprivileged process can bind it
# first and receive the stream (#35). Its own ruleset: these events never
# reach the default ruleset, the journal or /var/log.
input(type="imtcp" address="127.0.0.1" port="514"
      ruleset="snitchwatch_endpoint_events"
      supportOctetCountedFraming="off")

# One JSON object per forwarded frame, allowlisted fields only. `time` is when
# rsyslog received the event from the daemon, RFC 3339 (the daemon's JSON
# carries no timestamp). `host_id` is informational: Vigie identifies this
# computer by its client certificate.
# rsyslog lowercases outnames, so the daemon's Action/Rule/Type go out as
# action/rule/type; they're written lowercase here to match the wire.
template(name="snitchwatch_endpoint_event" type="list" option.jsonf="on") {
    property(outname="time" name="timegenerated" dateFormat="rfc3339" format="jsonf")
    constant(outname="host_id" value="@HOST_ID@" format="jsonf")
    property(outname="protocol" name="$!Event!protocol" format="jsonf")
    property(outname="src_ip" name="$!Event!src_ip" format="jsonf")
    property(outname="src_port" name="$!Event!src_port" format="jsonf" datatype="number" onEmpty="skip")
    property(outname="dst_ip" name="$!Event!dst_ip" format="jsonf")
    property(outname="dst_port" name="$!Event!dst_port" format="jsonf" datatype="number" onEmpty="skip")
    property(outname="dst_host" name="$!Event!dst_host" format="jsonf" position.to="253")
    property(outname="process_path" name="$!Event!process_path" format="jsonf" position.to="768")
    property(outname="user_id" name="$!Event!user_id" format="jsonf" datatype="number" onEmpty="skip")
    property(outname="action" name="$!Action" format="jsonf")
    property(outname="rule" name="$!Rule" format="jsonf" position.to="128")
    property(outname="type" name="$!Type" format="jsonf" datatype="number")
}

ruleset(name="snitchwatch_endpoint_events") {
    # The daemon sends bare JSON lines, no syslog header, so parse the raw
    # line (Fedora ships no pmnull) with an empty cookie.
    action(type="mmjsonparse" cookie="" useRawMsg="on")

    # Forward only connection events (Type 0) that parsed. Anything else
    # (blank frames, non-JSON, task notifications) is dropped by the `stop`
    # below and never forwarded.
    if $parsesuccess == "OK" and $!Type == 0 then {
        # Mutual TLS, mandatory (mode 1): Vigie must present a certificate
        # signed by the pinned CA with this name, and this computer presents
        # its own client certificate, which is how Vigie identifies it.
        #
        # Queue: in memory only, bounded. When it's full (Vigie unreachable
        # for long), new events are dropped at once rather than blocking the
        # listener; the daemon drops them too while rsyslog is down. There is
        # deliberately no disk-assisted queue: it would write the whole raw
        # event, environment and arguments included, to disk.
        action(type="omfwd" name="snitchwatch_to_vigie"
               target="@VIGIE_ADDRESS@" port="@VIGIE_PORT@" protocol="tcp"
               template="snitchwatch_endpoint_event"
               tcp_framing="octet-counted"
               StreamDriver="gtls" StreamDriverMode="1"
               StreamDriverAuthMode="x509/name"
               StreamDriverPermittedPeers="@VIGIE_CERT_NAME@"
               streamDriver.CAFile="/etc/pki/snitchwatch-endpoint-events/vigie-ca.pem"
               streamDriver.CertFile="/etc/pki/snitchwatch-endpoint-events/host-cert.pem"
               streamDriver.KeyFile="/etc/pki/snitchwatch-endpoint-events/host-key.pem"
               queue.type="LinkedList" queue.size="10000"
               queue.timeoutEnqueue="0"
               action.resumeRetryCount="-1" action.resumeInterval="10")
    }
    stop
}
