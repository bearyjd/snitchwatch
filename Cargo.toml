[workspace]
resolver = "2"
members = [
    "crates/snitchwatch-proto",
    "crates/snitchwatch-spike",
    "crates/snitchwatch-bridge",
    "crates/snitchwatch-bridge-cli",
    "crates/snitchwatch-tauri",
    "crates/kirigami-spike",
    "crates/snitchwatch-kirigami",
    "crates/scanner-core",
    "crates/scanner-cli",
    "crates/scanner-privileged",
    "tests/mock_opensnitchd",
    "tests/integration",
]
# `kirigami-spike` and `snitchwatch-kirigami` require system Qt6 + Kirigami dev
# packages to build (see
# docs/superpowers/specs/2026-07-04-cxx-qt-feasibility-research.md) — it's a
# throwaway Phase 3a feasibility spike, not shipped functionality, and
# shouldn't force that dependency on every contributor running a bare
# `cargo build`/`cargo test`. Build it explicitly via `-p kirigami-spike`.
default-members = [
    "crates/snitchwatch-proto",
    "crates/snitchwatch-spike",
    "crates/snitchwatch-bridge",
    "crates/snitchwatch-bridge-cli",
    "crates/snitchwatch-tauri",
    "crates/scanner-core",
    "crates/scanner-cli",
    "crates/scanner-privileged",
    "tests/mock_opensnitchd",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0"
repository = "https://github.com/example/snitchwatch"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
regex = "1"
anyhow = "1"
proptest = "1"
async-stream = "0.3"
tokio-stream = "0.1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
addr = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
async-trait = "0.1"
rand = "0.8"
tempfile = "3"
sha2 = "0.10"
zbus = { version = "4", default-features = false, features = ["tokio"] }
