[package]
name = "snitchwatch-bridge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "snitchwatch_bridge_cli"
path = "src/lib.rs"

[[bin]]
name = "snitchwatch-bridge-cli"
path = "src/main.rs"

[features]
default = ["web-ui"]
# Passes through to snitchwatch-bridge's `web-ui` (the embedded web frontend).
# The release tarball builds with `--no-default-features`; see that crate's
# Cargo.toml for why.
web-ui = ["snitchwatch-bridge/web-ui"]

[dependencies]
snitchwatch-bridge = { path = "../snitchwatch-bridge", default-features = false }
snitchwatch-proto = { path = "../snitchwatch-proto" }
tokio = { workspace = true }
tokio-stream = "0.1"
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
async-trait = { workspace = true }
mock-opensnitchd = { path = "../../tests/mock_opensnitchd" }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.4", features = ["util"] }
# `tokio::time::pause`/`advance` for the timed-pause expiry tests (issue #47).
tokio = { workspace = true, features = ["test-util"] }
