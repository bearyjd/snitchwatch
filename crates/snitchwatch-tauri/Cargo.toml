[package]
name = "snitchwatch-tauri"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0"
description = "Snitchwatch desktop shell — Tauri 2 wrapper around the bridge."

[[bin]]
name = "snitchwatch-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
snitchwatch-bridge = { path = "../snitchwatch-bridge" }
snitchwatch-bridge-cli = { path = "../snitchwatch-bridge-cli" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
notify-rust = "4"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "macros", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
which = "6"
rand = { workspace = true }

[dev-dependencies]
tokio = { version = "1.40", features = ["test-util"] }
tempfile = "3"
