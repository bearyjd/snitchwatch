[package]
name = "snitchwatch-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
snitchwatch-proto = { path = "../snitchwatch-proto" }
tokio = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }
tokio-tungstenite = { workspace = true }
rust-embed = { version = "8", features = ["interpolate-folder-path"], optional = true }
mime_guess = { version = "2", optional = true }
futures-util = { workspace = true }
regex = { workspace = true }
regex-syntax = { workspace = true }
anyhow = { workspace = true }
async-stream = { workspace = true }
tokio-stream = { workspace = true }
rusqlite = { workspace = true }
reqwest = { workspace = true }
addr = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }
zbus = { workspace = true }
# axum 0.7's `axum::serve` only accepts a `tokio::net::TcpListener`; serving
# over a `UnixListener` requires driving hyper directly (mirrors axum's own
# `unix-domain-socket` example).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
tower = { version = "0.5", features = ["util"] }
libc = "0.2"

[features]
default = ["web-ui"]
# Embed and serve the vendored `web/` frontend on `/`, `/assets/*` and the SPA
# fallback. On by default (dev builds, the Tauri shell, tests). The release
# tarball builds without it: `web/` is Objective Development's GPL-2.0-only
# code, which can't share an executable with this crate's GPL-3.0 and
# Apache-2.0-only inputs (docs/superpowers/plans/2026-10-03-bridge-release-
# artifact.md, decision I). Nothing in the image deployment uses those routes.
web-ui = ["dep:rust-embed", "dep:mime_guess"]

[dev-dependencies]
proptest = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
tempfile = { workspace = true }
tokio = { version = "1.40", features = ["test-util"] }
# Local TLS server for the https-only fetcher tests (issue #45). `ring`, the
# provider reqwest's rustls already uses; the default `aws_lc_rs` is not wanted.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
